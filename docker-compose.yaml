volumes:
  infra_mongo_data:
  infra_redis_data:

networks:
  infra_network:
    external: true

services:
  mongodb:
    image: mongo:latest
    container_name: infra_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin}
    volumes:
      - infra_mongo_data:/data/db
    networks:
      - infra_network
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    container_name: infra_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-admin} --appendonly yes
    volumes:
      - infra_redis_data:/data
    networks:
      - infra_network
    ports:
      - "6379:6379"

  vaulty_api:
    build: .
    container_name: vaulty_api
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - infra_network
    depends_on:
      - mongodb
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    expose:
      - "3000"

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - vaulty_api
    networks:
      - infra_network
